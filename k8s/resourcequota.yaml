apiVersion: v1
kind: ResourceQuota
metadata:
  name: research-agent-quota
  namespace: research-agent
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    persistentvolumeclaims: "5"
    pods: "20"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: sandbox-quota
  namespace: research-agent-sandbox
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "16"
    limits.memory: "32Gi"
    pods: "50"
    jobs: "20"
