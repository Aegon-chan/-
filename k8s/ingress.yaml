apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: research-agent
  namespace: research-agent
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: research-agent.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: research-agent
            port:
              number: 8080
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: research-agent
            port:
              number: 8000
