apiVersion: v1
kind: ConfigMap
metadata:
  name: research-agent-config
  namespace: research-agent
  labels:
    app: research-agent
data:
  APP_ENV: production
  APP_DEBUG: "false"
  DATABASE_URL: sqlite:///./data/research_agent.db
  LOG_LEVEL: INFO
  SANDBOX_TIMEOUT: "60"
  SANDBOX_CPU_REQUEST: 500m
  SANDBOX_CPU_LIMIT: "2"
  SANDBOX_MEMORY_REQUEST: 512Mi
  SANDBOX_MEMORY_LIMIT: 2Gi
  SANDBOX_DEFAULT_IMAGE: research-agent-sandbox:latest
