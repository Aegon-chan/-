<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="5" fill="#1565C0"/><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">专业数据分析</text><rect x="60" y="75" width="60" height="4" rx="2" fill="#00BFA5"/><text x="60" y="108" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#64748B">面向地质与水文监测领域的全方位专业数据分析能力</text><rect x="60" y="140" width="530" height="95" rx="10" fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="140" width="4" height="95" fill="#1565C0"/><text x="85" y="172" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1565C0">GNSS 位移分析</text><text x="85" y="200" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">时间序列分解 / 突变检测 / 速率估计 / 趋势项提取</text><rect x="690" y="140" width="530" height="95" rx="10" fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1"/><rect x="690" y="140" width="4" height="95" fill="#00BFA5"/><text x="715" y="172" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#0D9488">InSAR 形变分析</text><text x="715" y="200" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">形变场插值 / 时序累积形变 / 形变速率图 / 异常识别</text><rect x="60" y="265" width="530" height="95" rx="10" fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="265" width="4" height="95" fill="#7C4DFF"/><text x="85" y="297" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#5B21B6">降雨数据分析</text><text x="85" y="325" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">累计降雨量 / 降雨强度 / 重现期估算 / 极端事件识别</text><rect x="690" y="265" width="530" height="95" rx="10" fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1"/><rect x="690" y="265" width="4" height="95" fill="#1565C0"/><text x="715" y="297" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1565C0">地下水位分析</text><text x="715" y="325" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">水位动态曲线 / 季节性变化 / 与降雨水位相关性分析</text><rect x="60" y="390" width="530" height="95" rx="10" fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1"/><rect x="60" y="390" width="4" height="95" fill="#00BFA5"/><text x="85" y="422" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#0D9488">孔隙水压力分析</text><text x="85" y="450" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">孔压变化趋势 / 超静孔压消散 / 降雨-孔压响应分析</text><rect x="690" y="390" width="530" height="95" rx="10" fill="#F0FDFA" stroke="#00BFA5" stroke-width="1"/><rect x="690" y="390" width="4" height="95" fill="#00BFA5"/><text x="715" y="422" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" font-weight="bold" fill="#0D9488">多源关联分析</text><text x="715" y="450" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#475569">降雨 vs 位移 vs 水位的交叉相关性 / 综合预警研判</text><text x="60" y="540" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="14" fill="#94A3B8">支持 CSV / Excel / GeoJSON 等多格式数据导入，自然语言驱动分析流程</text><rect x="0" y="710" width="1280" height="10" fill="#1565C0" fill-opacity="0.08"/><text x="60" y="705" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8">Research Agent  ·  P05</text></svg>