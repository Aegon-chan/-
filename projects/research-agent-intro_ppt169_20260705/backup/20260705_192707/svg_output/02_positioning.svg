<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1565C0"/><stop offset="100%" stop-color="#7C4DFF"/></linearGradient></defs><rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="5" fill="#1565C0"/><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">项目定位</text><rect x="60" y="75" width="60" height="4" rx="2" fill="#00BFA5"/><rect x="60" y="130" width="380" height="520" rx="16" fill="#F5F7FA"/><text x="250" y="400" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" fill="#64748B" text-anchor="middle">AI Agent 赋能科研数据分析</text><text x="500" y="160" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">背景痛点</text><text x="500" y="195" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569"><tspan x="500" dy="0">传统监测数据处理依赖人工操作：数据格式繁多、</tspan><tspan x="500" dy="28">分析流程重复、报告编写耗时，技术门槛高。</tspan></text><text x="500" y="280" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">解决方案</text><text x="500" y="315" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569"><tspan x="500" dy="0">以 AI Agent 赋能科研数据分析：自然语言驱动</tspan><tspan x="500" dy="28">专业分析、语义检索规范文献、自动生成监测报告、</tspan><tspan x="500" dy="28">通过用户反馈持续自我进化。</tspan></text><text x="500" y="420" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">目标用户</text><text x="500" y="455" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569">地质工程师 / 水文研究员 / 监测数据分析师</text><text x="500" y="530" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">核心命题</text><text x="500" y="565" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569">一个能通过持续使用与反馈自我进化的科研数据智能分析助手。</text><rect x="0" y="710" width="1280" height="10" fill="#1565C0" fill-opacity="0.08"/><text x="60" y="705" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8">Research Agent  ·  P02</text></svg>