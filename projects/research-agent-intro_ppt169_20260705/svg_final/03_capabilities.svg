69">代码执行等完成复杂任务</text><rect x="0" y="710" width="1280" height="10" fill="#1565C0" fill-opacity="0.08" /><text x="60" y="705" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8">Research Agent  ·  P03</text></svg>