<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF" /><rect x="0" y="0" width="1280" height="5" fill="#1565C0" /><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">技术亮点</text><path fill="#00BFA5" d="M62,75 H118 A2,2 0 0 1 120,77 V77 A2,2 0 0 1 118,79 H62 A2,2 0 0 1 60,77 V77 A2,2 0 0 1 62,75 Z" /><text x="60" y="108" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#64748B">多项关键技术决策确保系统的先进性、安全性与可用性</text><path fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1" d="M72,140 H578 A12,12 0 0 1 590,152 V348 A12,12 0 0 1 578,360 H72 A12,12 0 0 1 60,348 V152 A12,12 0 0 1 72,140 Z" /><rect x="60" y="140" width="6" height="220" fill="#1565C0" /><text x="90" y="185" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="22" font-weight="bold" fill="#1565C0">架构先进</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="90" y="225">FastAPI 异步高性能框架</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="90" y="255">LangChain + 自定义 Agent 引擎</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="90" y="285">模块化设计，各层松耦合</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="90" y="315">自动化 OpenAPI 文档</text><path fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1" d="M702,140 H1208 A12,12 0 0 1 1220,152 V348 A12,12 0 0 1 1208,360 H702 A12,12 0 0 1 690,348 V152 A12,12 0 0 1 702,140 Z" /><rect x="690" y="140" width="6" height="220" fill="#00BFA5" /><text x="720" y="185" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="22" font-weight="bold" fill="#0D9488">自我进化</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="720" y="225">反馈驱动 + APE Prompt 优化</text><