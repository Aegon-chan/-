<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><defs><linearGradient id="hG" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#1565C0" /><stop offset="100%" stop-color="#7C4DFF" /></linearGradient></defs><rect width="1280" height="720" fill="#FFFFFF" /><rect x="0" y="0" width="1280" height="5" fill="#1565C0" /><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">项目定位</text><path fill="#00BFA5" d="M62,75 H118 A2,2 0 0 1 120,77 V77 A2,2 0 0 1 118,79 H62 A2,2 0 0 1 60,77 V77 A2,2 0 0 1 62,75 Z" /><path fill="#F5F7FA" d="M76,130 H424 A16,16 0 0 1 440,146 V634 A16,16 0 0 1 424,650 H76 A16,16 0 0 1 60,634 V146 A16,16 0 0 1 76,130 Z" /><text x="250" y="400" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="18" fill="#64748B" text-anchor="middle">AI Agent 赋能科研数据分析</text><text x="500" y="160" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">背景痛点</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569" x="500" y="195">传统监测数据处理依赖人工操作：数据格式繁多、</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569" x="500" y="223">分析流程重复、报告编写耗时，技术门槛高。</text><text x="500" y="280" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">解决方案</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569" x="500" y="315">以 AI Agent 赋能科研数据分析：自然语言驱动</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569" x="500" y="343">专业分析、语义检索规范文献、自动生成监测报告、</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569" x="500" y="371">通过用户反馈持续自我进化。</text><text x="500" y="420" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">目标用户</text><text x="500" y="455" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569">地质工程师 / 水文研究员 / 监测数据分析师</text><text x="500" y="530" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1565C0">核心命题</text><text x="500" y="565" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#475569">一个能通过持续使用与反馈自我进化的科研数据智能分析助手。</text><rect x="0" y="710" width="1280" height="10" fill="#1565C0" fill-opacity="0.08" /><text x="60" y="705" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8">Research Agent  ·  P02</text></svg>