<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF" /><rect x="0" y="0" width="1280" height="5" fill="#1565C0" /><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">自我成长体系</text><path fill="#00BFA5" d="M62,75 H118 A2,2 0 0 1 120,77 V77 A2,2 0 0 1 118,79 H62 A2,2 0 0 1 60,77 V77 A2,2 0 0 1 62,75 Z" /><text x="60" y="108" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#64748B">每一次使用都在让 Agent 变得更好——核心差异化能力</text><circle cx="640" cy="400" r="70" fill="#1565C0" /><text x="640" y="390" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">自我</text><text x="640" y="415" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">成长</text><path fill="#F0FDFA" stroke="#00BFA5" stroke-width="1" d="M452,140 H828 A12,12 0 0 1 840,152 V208 A12,12 0 0 1 828,220 H452 A12,12 0 0 1 440,208 V152 A12,12 0 0 1 452,140 Z" /><text x="640" y="174" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" font-weight="bold" fill="#0D9488" text-anchor="middle">记忆网络</text><text x="640" y="202" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">短期对话 + 长期持久化记忆 / TF-IDF加权 / 时效衰减</text><path d="M640,220 L640,320" stroke="#00BFA5" stroke-width="2" stroke-dasharray="6,3" /><polygon points="635,315 640,325 645,315" fill="#00BFA5" /><path fill="#F5F3FF" stroke="#7C4DFF" stroke-width="1" d="M852,340 H1178 A12,12 0 0 1 1190,352 V408 A12,12 0 0 1 1178,420 H852 A12,12 0 0 1 840,408 V352 A12,12 0 0 1 852,340 Z" /><text x="1015" y="374" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" font-weight="bold" fill="#5B21B6" text-anchor="middle">反馈系统</text><text x="1015" y="402" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">显式反馈（点赞/评分）+ 隐式反馈（用户行为）</text><path d="M720,390 L830,390" stroke="#7C4DFF" stroke-width="2" stroke-dasharray="6,3" /><polygon points="825,385 835,390 825,395" fill="#7C4DFF" /><path fill="#F0FDF4" stroke="#10B981" stroke-width="1" d="M452,530 H828 A12,12 0 0 1 840,542 V598 A12,12 0 0 1 828,610 H452 A12,12 0 0 1 440,598 V542 A12,12 0 0 1 452,530 Z" /><text x="640" y="564" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" font-weight="bold" fill="#059669" text-anchor="middle">Prompt 自动优化 (APE)</text><text x="640" y="592" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">自动搜索更优 Prompt / A/B 测试验证效果</text><path d="M640,470 L640,520" stroke="#10B981" stroke-width="2" stroke-dasharray="6,3" /><polygon points="635,515 640,525 645,515" fill="#10B981" /><path fill="#EFF6FF" stroke="#1565C0" stroke-width="1" d="M102,340 H428 A12,12 0 0 1 440,352 V408 A12,12 0 0 1 428,420 H102 A12,12 0 0 1 90,408 V352 A12,12 0 0 1 102,340 Z" /><text x="265" y="374" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" font-weight="bold" fill="#1565C0" text-anchor="middle">LoRA 微调</text><text x="265" y="402" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="12" fill="#64748B" text-anchor="middle">基于 HuggingFace PEFT 的低资源微调管线</text><path d="M450,390 L560,390" stroke="#1565C0" stroke-width="2" stroke-dasharray="6,3" /><polygon points="555,385 565,390 555,395" fill="#1565C0" /><text x="150" y="338" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">数据驱动</text><text x="1040" y="338" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">效果验证</text><text x="640" y="470" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">持续优化</text