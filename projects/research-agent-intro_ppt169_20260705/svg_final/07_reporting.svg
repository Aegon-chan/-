<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#FFFFFF" /><rect x="0" y="0" width="1280" height="5" fill="#1565C0" /><text x="60" y="60" font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif" font-size="36" font-weight="bold" fill="#1E293B">自动报告生成</text><path fill="#00BFA5" d="M62,75 H118 A2,2 0 0 1 120,77 V77 A2,2 0 0 1 118,79 H62 A2,2 0 0 1 60,77 V77 A2,2 0 0 1 62,75 Z" /><text x="60" y="108" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="16" fill="#64748B">一键生成多格式专业监测报告，内置丰富图表引擎</text><path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M72,140 H398 A12,12 0 0 1 410,152 V398 A12,12 0 0 1 398,410 H72 A12,12 0 0 1 60,398 V152 A12,12 0 0 1 72,140 Z" /><rect x="60" y="140" width="350" height="5" fill="#1565C0" /><text x="235" y="200" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">多格式输出</text><path fill="#1565C0" fill-opacity="0.08" d="M106,225 H364 A6,6 0 0 1 370,231 V261 A6,6 0 0 1 364,267 H106 A6,6 0 0 1 100,261 V231 A6,6 0 0 1 106,225 Z" /><text x="235" y="252" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#1565C0" text-anchor="middle">HTML 在线预览与分享</text><path fill="#00BFA5" fill-opacity="0.08" d="M106,277 H364 A6,6 0 0 1 370,283 V313 A6,6 0 0 1 364,319 H106 A6,6 0 0 1 100,313 V283 A6,6 0 0 1 106,277 Z" /><text x="235" y="304" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#0D9488" text-anchor="middle">DOCX Word 可编辑版本</text><path fill="#7C4DFF" fill-opacity="0.08" d="M106,329 H364 A6,6 0 0 1 370,335 V365 A6,6 0 0 1 364,371 H106 A6,6 0 0 1 100,365 V335 A6,6 0 0 1 106,329 Z" /><text x="235" y="356" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#5B21B6" text-anchor="middle">PDF 正式交付格式</text><path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M477,140 H803 A12,12 0 0 1 815,152 V398 A12,12 0 0 1 803,410 H477 A12,12 0 0 1 465,398 V152 A12,12 0 0 1 477,140 Z" /><rect x="465" y="140" width="350" height="5" fill="#00BFA5" /><text x="640" y="200" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">双图表引擎</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="480" y="240">Plotly 交互式图表</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="480" y="268">折线图 / 散点图 / 热力图 / 剖面图</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="480" y="304">Matplotlib 出版级静态图表</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="480" y="332">时间序列 / 相关性 / 分布图</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="480" y="368">支持高清图像导出嵌入报告</text><path fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1" d="M882,140 H1208 A12,12 0 0 1 1220,152 V398 A12,12 0 0 1 1208,410 H882 A12,12 0 0 1 870,398 V152 A12,12 0 0 1 882,140 Z" /><rect x="870" y="140" width="350" height="5" fill="#7C4DFF" /><text x="1045" y="200" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="20" font-weight="bold" fill="#1E293B" text-anchor="middle">模板系统</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="885" y="240">Jinja2 模板引擎</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="885" y="268">预置模板：日报 / 周报 / 月报 / 专项</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="885" y="304">支持自定义模板定制</text><text font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" fill="#475569" x="885" y="332">一键闭环：数据-&gt;分析-&gt;图表-&gt;报告</text><path fill="#F5F7FA" stroke="#E2E8F0" stroke-width="1" d="M72,450 H1208 A12,12 0 0 1 1220,462 V528 A12,12 0 0 1 1208,540 H72 A12,12 0 0 1 60,528 V462 A12,12 0 0 1 72,450 Z" /><text x="80" y="478" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="15" font-weight="bold" fill="#1E293B">报告生成流程</text><path fill="#1565C0" d="M126,495 H274 A6,6 0 0 1 280,501 V519 A6,6 0 0 1 274,525 H126 A6,6 0 0 1 120,519 V501 A6,6 0 0 1 126,495 Z" /><text x="200" y="515" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">数据导入</text><path d="M280,510 L320,510" stroke="#94A3B8" stroke-width="2" /><polygon points="315,506 325,510 315,514" fill="#94A3B8" /><path fill="#00BFA5" d="M336,495 H484 A6,6 0 0 1 490,501 V519 A6,6 0 0 1 484,525 H336 A6,6 0 0 1 330,519 V501 A6,6 0 0 1 336,495 Z" /><text x="410" y="515" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">智能分析</text><path d="M490,510 L530,510" stroke="#94A3B8" stroke-width="2" /><polygon points="525,506 535,510 525,514" fill="#94A3B8" /><path fill="#7C4DFF" d="M546,495 H694 A6,6 0 0 1 700,501 V519 A6,6 0 0 1 694,525 H546 A6,6 0 0 1 540,519 V501 A6,6 0 0 1 546,495 Z" /><text x="620" y="515" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">图表生成</text><path d="M700,510 L740,510" stroke="#94A3B8" stroke-width="2" /><polygon points="735,506 745,510 735,514" fill="#94A3B8" /><path fill="#1565C0" d="M756,495 H924 A6,6 0 0 1 930,501 V519 A6,6 0 0 1 924,525 H756 A6,6 0 0 1 750,519 V501 A6,6 0 0 1 756,495 Z" /><text x="840" y="515" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">一键输出报告</text><rect x="0" y="710" width="1280" height="10" fill="#1565C0" fill-opacity="0.08" /><text x="60" y="705" font-family="Microsoft YaHei,PingFang SC,Arial,sans-serif" font-size="11" fill="#94A3B8">Research Agent  ·  P07</text></svg