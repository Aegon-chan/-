[project]
name = "research-agent"
version = "0.1.0"
description = "具备自我成长能力的AI数据分析助手 —— 面向GNSS/InSAR/水文监测数据的智能分析平台"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Agent Team"}
]

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.0",
    "httpx>=0.26.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
analysis = [
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scipy>=1.12.0",
    "statsmodels>=0.14.0",
    "openpyxl>=3.1.0",
]
visualization = [
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
]
ai = [
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "openai>=1.12.0",
    "tiktoken>=0.6.0",
]
retrieval = [
    "chromadb>=0.5.0",
    "sentence-transformers>=2.3.0",
    "pdfplumber>=0.10.0",
]
reporting = [
    "jinja2>=3.1.0",
    "weasyprint>=60.0",
    "docx>=1.1.0",
]
frontend = [
]
self-growth = [
    "torch>=2.1.0",
    "transformers>=4.36.0",
    "peft>=0.8.0",
    "datasets>=2.16.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:legacy embedding function config:DeprecationWarning:chromadb.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]
